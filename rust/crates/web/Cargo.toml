[package]
name = "fleetmux-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "fleetmux-web: native desktop window for the fleetmux terminal."

# M2.5 native web window (design v1.1 §3.5). W6 step 1 only adds the package so the workspace resolves and
# builds; W0 writes the public signatures and red tests, W1 the implementation.
[[bin]]
name = "fleetmux-web"
path = "src/main.rs"

[dependencies]
wry.workspace = true
tao.workspace = true
libc.workspace = true        # W1: getuid, peer uid (getpeereid / SO_PEERCRED), stat uid/mode on web.sock
serde_json.workspace = true  # W1: web.sock JSON lines
fleetmux-proto = { path = "../proto", version = "0.2.2" }  # M2.6 W1: pipe frame codec (0x81 / 0x85 in, 0x01 / 0x02 out; design v1.2 §3.6.2)

[dev-dependencies]
sha2 = "0.10.9"  # M2.6 tests: vendored xterm.js sha256 = MANIFEST.json; same version wry already brings into Cargo.lock

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"  # quiet.rs: NSWindow setAlphaValue; the same 0.6.5 tao / wry already bring into Cargo.lock

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk.workspace = true
gtk.workspace = true          # A26 rev5: the window's one native header row (GtkHeaderBar as its titlebar)
