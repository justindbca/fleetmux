# fleetmux: fleet-only fixed-layout terminal (design: docs/design.md §33.6). Workspace members and their
# dependencies are declared up front; workers do not edit this file or Cargo.lock (ask the integrator).
[workspace]
resolver = "3"
members = ["crates/proto", "crates/term", "crates/layout", "crates/app", "crates/probe", "crates/web"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
rust-version = "1.99"
publish = false

[workspace.dependencies]
fleetmux-proto = { path = "crates/proto" }
fleetmux-term = { path = "crates/term" }
fleetmux-layout = { path = "crates/layout" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alacritty_terminal = "0.26"
ratatui = "0.30"
crossterm = "0.29"
portable-pty = "0.9"
tokio = { version = "1.54", features = ["full"] }
libc = "0.2"
insta = "1.49"
base64 = "0.22"
unicode-width = "0.2"
# M2.5 native web window (`crates/web`, package fleetmux-web; design v1.1 §3.5.9): exact pins, webkit2gtk = wry's pin.
wry = "=0.57.1"
tao = "=0.37.2"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
# A26 rev5 (`CURRENT_REQUIREMENTS` rev 6 `utm_topbar`): the Linux window draws one native header row, so
# `crates/web` needs GTK itself (`gtk_window_set_titlebar` + `GtkHeaderBar`). The same 0.18.2 tao 0.37.2 and
# wry 0.57.1 already build against: one copy in Cargo.lock, no new transitive dependency.
gtk = "=0.18.2"
