# Third-party licence notices for release tarballs (`cargo about generate about.hbs`), design §8 item 12.
# `accepted` mirrors deny.toml's allow list plus MPL-2.0 (deny.toml is the gate and admits MPL only for option-ext;
# here MPL-2.0 only lets its notice be rendered). The gnu targets are fleetmux-web's (M2.5).
accepted = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
            "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "0BSD", "CC0-1.0", "BSL-1.0", "MPL-2.0"]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "aarch64-apple-darwin", "x86_64-apple-darwin",
           "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
