# Licence gate (design §1 clean-room rule): only permissive licences; GPL / LGPL / MPL and anything
# unlisted fail `cargo deny check licenses`.
# M2.5 (design v1.1 §3.5.9 / §8 item 12, user-approved 2026-10-28): the graph is limited to the release targets
# (four fleetmux + two gnu for fleetmux-web), which drops the Android-only MPL crates; the one MPL crate on every
# release target, option-ext (wry -> dirs -> dirs-sys), is a single-crate exception. MPL is NOT in `allow`.
[graph]
all-features = true
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "aarch64-apple-darwin", "x86_64-apple-darwin",
           "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
         "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "0BSD", "CC0-1.0", "BSL-1.0"]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]
