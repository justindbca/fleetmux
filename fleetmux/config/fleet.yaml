# accounts: a budget card's "pool" names an account by id or alias; meter picks the budget line:
#   usd_equiv -> max_usd (equivalent USD since the card started; caps.day_usd / night_usd is the default
#                cap when the card has none, else 40 / 10), week_pct -> max_week_pct (absolute weekly %),
#   calls / none -> no pool line. Readings come from quota.json (rows keyed by account id), through the
#   hot quota block of fleet-superpowers (docs/design.md section 56).
# Example for the private file:
#   accounts:
#     - {id: pool-a, provider: claude, aliases: [], meter: usd_equiv, hosts: [host-1], caps: {day_usd: 40, night_usd: 10}}
#     - {id: pool-b, provider: claude, meter: week_pct, hosts: [host-2]}
#     - {id: codex-a, provider: codex, meter: week_pct}
accounts: []

# tools: tool pools (Tavily keys, X accounts, ...) behind thin MCP servers; filled in the private file.
tools: {}

pi_context:
  # Context window of pi models in every run (user 2026-10-27: default 400K, with a place to change it).
  # start writes <run>/pi-home/models.json as a copy of the source models.json with these applied
  # (no block, or neither key set: the source file is linked as before).
  #   default_window: custom models (providers.*.models[]) that set no contextWindow get this value.
  #                   Models that set their own window keep it (e.g. a local model capped by memory).
  #   per_model:      "<provider>/<model id>" -> window, set even when the model has its own value;
  #                   a built-in model (not in the source file) goes to providers.<p>.modelOverrides.
  # The fleet's handoff thresholds read the window pi reports, so fleet and pi always agree.
  # Override the whole block in the private file (~/.fleetmux/fleet.yaml).
  default_window: 400000
  per_model: {}

daemon_watch:
  # The supervisor's daemon watchdog (docs/design.md §36; pi supervisor: fleet's pi extension). Every
  # check_interval_s it asks its bridge for fx:daemon:beat. Older than stale_after_s, no daemon holding the run's
  # lock and the run unfinished -> one supervisor turn with the log facts; the supervisor runs the restart command
  # its AGENTS.md names. No second turn within realert_after_s. Read when a supervisor generation starts.
  # Override the whole block in the private file (~/.fleetmux/fleet.yaml); seconds > 0.
  check_interval_s: 120
  stale_after_s: 120
  realert_after_s: 600
  # The daemon's held watchdog (docs/design.md §24): a slot held (or waiting on a user dialog), or the run paused,
  # for held_after_s awake seconds with no session progress -> the daemon recovers it when its turn is proven
  # stopped, else escalates (parent fleet supervisor / root tg + parent channels); again at most every
  # held_realert_s. Read by the daemon (hot, within 30 s); not passed to the pi extension.
  held_after_s: 300
  held_realert_s: 1800
  # The parent's view of each running sub-fleet (R3b, same section): every subfleet_check_s the parent daemon reads
  # the sub-fleet's own Redis (daemon heartbeat, last non-bookkeeping audit row, paused, held supervisor, task
  # state); no progress for subfleet_stuck_after_s -> [sub-fleet stuck] to the parent supervisor and, at a managed
  # root, the user channel; again at most every held_realert_s. Works when the sub-fleet's daemon itself is down.
  subfleet_stuck_after_s: 600
  subfleet_check_s: 60
  # Supervisor regeneration (docs/design.md §24): this fleet's own supervisor (not an adopted sub-fleet supervisor)
  # held and not recovered by the existing path (stop proof -> API-error retry) for held_after_s, or ended by an
  # API / network error -> the daemon ends that session (kill and verify, screen kept in history) and starts its
  # next generation; the unsettled message goes to it once with a note. At most supervisor_regen_max new
  # generations within supervisor_regen_window_s awake seconds (its own budget, separate from the link-restart
  # limit); supervisor_regen_backoff_s between two (seconds, or a list: the k-th wait, the last repeats). Before
  # each, a connectivity probe: auto = the CLI's declared route port, plus the TCP probes when the last error is a
  # network error; tcp = always both; off = none. Offline waits backoff[0] and spends nothing. Used up -> reported
  # outward (parent fleet, lifecycle notify, the run's channels), never to the supervisor itself. Each key is
  # validated on its own; a bad value keeps its default. Read by the daemon; not passed to the pi extension.
  supervisor_regen: true
  supervisor_regen_max: 3
  supervisor_regen_window_s: 3600
  supervisor_regen_backoff_s: [60, 300, 900]
  supervisor_regen_probe: auto
  # Supervisor BLOCKED on a sub-fleet notice (docs/design.md section 24): at a root fleet (no parent), a BLOCKED that answers a
  # [sub-fleet stuck] / [sub-fleet held] notice about one of its own sub-fleets only marks that sub-fleet as waiting
  # for a human (`attention` in its record, shown by `fleetmux status`); the root is not paused and its task does not
  # end. The marked sub-fleet is not reported to the supervisor again until it moves; the user channel still is.
  # false = every BLOCKED pauses the root (service) / ends its task (task). A fleet with a parent always keeps that.
  # Read by the daemon; not passed to the pi extension.
  subfleet_blocked_marks_child: true
  # No route for human notices (docs/design.md section 24): a root fleet with no channels entry that pushes run_closed
  # or daemon_down, no FLEETMUX_TG_CMD / notify_commands.tg and no initiator says so at start (stderr), at the daemon
  # start (audit notify.no_route) and in `fleetmux status` (human_notice). Every notice for a human that left on no
  # leg is counted in <run>/notify-undelivered.json with the full text of the latest one. false = no warning, no
  # count. Read by the daemon; not passed to the pi extension.
  no_route_alarm: true
  # Held requeue (docs/design.md section 24): a service worker whose turn on a pure request was interrupted (cause in
  # held_requeue_causes: aborted = Escape / abort, lease_expired, renew_failed; also known: failed, unfinished,
  # unconfirmed) is held alone, with no public result and no fleet pause. After held_requeue_after_s seconds the
  # daemon ends that session (kill and verify), starts its next generation and routes the request again (replay + 1
  # within max_attempts). Not for task mode, replay: false, operator requests, applet slots, mid-turn messages, or a
  # turn that ended with a tool still running. At most held_requeue_max new generations per slot within
  # held_requeue_window_s awake seconds. Giving up = today's behaviour: failed published, run paused, escalated.
  # Each key is validated on its own; a bad value keeps its default. Read by the daemon; not passed to pi.
  held_requeue: true
  held_requeue_causes: [aborted, lease_expired, renew_failed]
  held_requeue_after_s: 30
  held_requeue_max: 3
  held_requeue_window_s: 3600
  # Pause review (docs/design.md section 24): a run paused for pause_review_after_s awake seconds is checked by its
  # daemon, then every pause_review_every_s. A cause that no longer holds is lifted and audited (pause_review.lifted).
  # A supervisor fault that still holds goes to supervisor regeneration. Never lifted: operator, budget line, delete
  # dialog, security, integrity, opencode refusal, a general BLOCKED. A wall pause is lifted at the wall's reset time
  # or after pause_review_wall_retry_s, at most 3 times for one wall. Each key is validated on its own; a bad value
  # keeps its default. Read by the daemon; not passed to the pi extension.
  pause_review: true
  pause_review_after_s: 1800
  pause_review_every_s: 300
  pause_review_wall_retry_s: 3600

fresh_dispatch:
  # docs/design.md §37. A dispatch without "fresh": true to a worker already above this share of its context
  # window is delivered as usual, and the supervisor's next message gets one [Hint] line suggesting
  # "fresh": true for unrelated work. Never resets anything by itself. A number in (0, 1].
  # Override the whole block in the private file (~/.fleetmux/fleet.yaml).
  fresh_hint_ratio: 0.3

handoff:
  # Context-handoff defaults (docs/design.md §22 and §34). Read on every check: an edit needs no daemon restart.
  # An unreadable or invalid block keeps the last good values; with none yet, start and the daemon refuse.
  # Roster and config.json `handoff:` tables, roster workers, agent cards (ratio) and typed flags rank above it.
  # Override the whole block, all five keys, in the private file (~/.fleetmux/fleet.yaml).
  ratio: 0.3  # rotate before a delivery once context use reaches this share of the window, in (0, 1]
  midturn_ratio: 0.8  # order a handoff inside a running turn at this share of the window, in (0, 1)
  handoff_timeout: 900  # seconds to wait for the model's handoff note before using the skeleton, > 0
  midturn_retry: 300  # seconds before the mid-turn order is typed again, then the session is rotated, >= 0.001
  midturn_max_splits: 3  # mid-turn handoffs allowed on one instruction, an integer >= 0 (0 = none)

dsh:
  # dsh workers (docs/design.md §41). `start` without --dsh-model runs this pi models.json entry
  # (provider/model) and records it as the run's dsh_model; --dsh-model overrides it (e.g. flashnext/...).
  # User 2026-11-05: WorkBuddy DeepSeek through a local gateway. Changes only here (reviewed commit).
  default_model: workbuddy-ds/workbuddy-ai/deepseek-v4.1-flash-sg

discovery:
  # First-run discovery (docs/design.md §52). `fleetmux setup`, and `start` / `gui` when <fleet home>/discovered.yaml
  # is missing, probe the agent CLIs below (version minimums from deps.yaml), their login state and the models each
  # can run, rank the models with this block and pick the default supervisor x worker pair from cli_pairs rows that
  # are verified for `mode`. `start` uses that pair only when neither --supervisor-cli nor --worker-cli is typed.
  # A pattern matches a model id lowercased and cut at - / _ . and spaces (contiguous tokens, e.g. qwen3.8 matches
  # Qwen3.8-Flash-Next); within one pattern the newest version wins, then cli_order.
  # User 2026-11-11 (replaces the 11-09 order): "对于supervisor，撞墙前优先级依次是Astra, fable, opus sol deepseek
  # flash,对于worker 撞墙前依次是opus, sol,sonnet,terra,deepseek flash" (list order = priority; unlisted models after
  # them). The same lists are the wall chains: after a usage wall a slot takes the next usable listed model
  # (unlisted ones are never a fallback; brake.wall_action). A model matching `supervisor` but no `worker` pattern (astra, fable) is supervisor-only. A space in a
  # pattern = words in that order, not necessarily adjacent ("deepseek flash" -> deepseek-v4.1-flash, not -v4-pro).
  # Override the whole block in the private file (~/.fleetmux/fleet.yaml).
  supervisor: [astra, fable, opus, sol, deepseek flash]
  worker: [opus, sol, sonnet, terra, deepseek flash]
  mode: task
  supervisor_pi_thinking: high
  # A worker's default thinking when nothing names its own (user 2026-11-11 「默认worker也是high」): pi --thinking for a
  # pi worker, Claude --effort for a Claude worker, and the level a worker gets when a wall moves it to pi.
  worker_thinking: high
  # CLIs whose models become candidates, in tie-break order; claude models come from the claude model cards above.
  cli_order: [claude, pi, opencode]
  # Design §6: Claude models only through the official claude CLI, Codex (gpt) models only through pi.
  only_via: {claude: claude, fable: claude, opus: claude, sonnet: claude, haiku: claude, gpt: pi}
  # Found and shown in the table, never a default candidate (no model listing, or not in the default pairs).
  report_only: [codex, dsh, gemini, ollama]
  # One account, one entry (user 2026-11-27: 「为什么就出现两个安装路径，然后导致一些程序识别成两个」). pi lists every
  # model once per login; the providers of one group are logins of the same account (openai = the OpenAI API OAuth,
  # openai-codex = ChatGPT/Codex). A model id listed by several providers of one group stays once, from the first
  # provider in pi_provider_prefer whose login works (`pi auth check`); a provider not listed comes after them.
  # Discovery and every wall chain read these. [] turns the choice off.
  pi_provider_prefer: [openai-codex]
  pi_provider_groups: {openai: [openai, openai-codex]}

remote:
  # `fleetmux remote` (design.md section 55): the machine that runs your fleet when this one is only a screen
  # and a keyboard. `fleetmux remote` shows its live page over ssh, `fleetmux remote <fleet command>` runs that
  # command there. Machines, their ssh destinations (reach) and their fleetmux path come from the machines block of
  # fleet-superpowers (docs/distributed-development.md). default: the machine used without --host (none needed when
  # the inventory names exactly one other machine). Set it in the private file (~/.fleetmux/fleet.yaml). Reaching
  # the machine (keys, ports, jump hosts) is your own ssh configuration.
  default: ""
  # The one order in which every machine tries the reach entries of another, by the route kind in each entry's
  # `via`: thunderbolt direct, LAN, overlay network (e.g. Tailscale), ssh through a domestic relay host, ssh
  # through an overseas relay host. List order is kept within a kind; a kind not listed here is tried last.
  # `superpowers add --via` accepts only these kinds. A private `remote` block without this key uses this order.
  reach_order: [thunderbolt, lan, overlay, tunnel, tunnel-overseas]

session_env:
  # Session environment from an applet (docs/distributed-development.md). An applet entry's session_env (port, vars,
  # clis) routes the sessions of these CLIs through the applet's loopback port. verified_clis: the CLIs a roster
  # may route; a roster that lists another CLI is refused whole. Add a CLI only after starting it through the
  # proxy and seeing a CONNECT to its API host in the proxy's log (that is the verification). Shipped file only.
  # wait_interval_s: how often a held session probes the port; probe_timeout_s: one probe's connect timeout.
  verified_clis: [claude]
  wait_interval_s: 2
  probe_timeout_s: 1

job_subfleet:
  # Jobs on a service fleet (docs/design.md §58). `fleetmux task <spec>` against a service fleet is a job: the
  # program takes one idle worker slot, makes it the supervisor of a task-mode sub-fleet with these settings, and
  # publishes the sub-fleet's outcome under the job id. A job spec may override each key for itself.
  # workers: number of sub-fleet workers (no default cap for jobs; a root limits.child_workers_max caps it).
  # supervisor_profile: agent card the slot runs on as sub-fleet supervisor (a claude card); null = its own model.
  # worker_profiles: one agent card per sub-fleet worker; [] = the fleet's default worker model.
  # hours: the sub-fleet task's time budget.
  # supervisor / worker: model chains for the job's sub-fleet supervisor and workers. Write them like
  # discovery.supervisor / discovery.worker: a list of model patterns, highest priority first. null = use the
  # discovery chain. [] is an error. The program resolves a chain on this machine (probe cache, only_via, cli_order,
  # cli_pairs) and takes the first usable entry. It never falls back to a model that is not on the chain.
  # A job spec may give its own "supervisor" / "worker" chain; the spec wins over this block.
  # A chain in a higher layer voids a card in a lower layer, and a card in a higher layer voids a chain in a lower
  # layer (layers: job spec, this block, discovery). Do not set a chain and a card in this block for the same role:
  # supervisor with supervisor_profile, or worker with a non-empty worker_profiles, is refused.
  # The supervisor of a job is an adopted official Claude Code pane: the program skips non-Claude supervisor entries
  # (for example Astra on pi) and records why. Workers run claude or pi.
  # Override the whole block in the private file (~/.fleetmux/fleet.yaml). A private block that sets
  # supervisor_profile keeps that card: its missing supervisor key is null.
  workers: 2
  supervisor_profile: null
  worker_profiles: []
  hours: 4
  supervisor: null
  worker: null

gui:
  # The root fleet daemon keeps its `fleetmux gui` window open (docs/design.md "Window keep-open"). Every check_s
  # seconds it looks for a `fleetmux gui --runtime <its runtime>` process and starts one in the background when there
  # is none, also when the fleet was started over ssh or by a scheduler. No launchd / cron item is needed for this.
  # Sub-fleets never open one (they show in the root's sidebar). A failed open waits check_s, then twice as long each
  # time, at most backoff_max_s. keep_open: false turns it off (read on every check, no restart needed); a run
  # started with `start --no-view` never opens it.
  # Override the whole block in the private file (~/.fleetmux/fleet.yaml); seconds > 0.
  keep_open: true
  check_s: 30
  backoff_max_s: 600

bare:
  # Bare `fleetmux` (= `fleetmux gui`) when no root fleet runs on this machine and this fleet home runs no fleet of
  # its own (docs/design.md section 50): it prints one line, then runs
  #   start --lifecycle <lifecycle> --name <name> --resume auto --no-join [--roster R | --workers N] <start_args>
  # with FLEETMUX_HOME=<home> and FLEETMUX_STATE=<home>/state, stdin from /dev/null. `--resume auto` resumes a
  # resumable earlier run of that home (a run stopped with `fleetmux stop` is finished: a new run starts, unless it
  # still holds open jobs, which continues it: docs/design.md section 58 "Restart"); other
  # fleet homes are not touched. No model is set here: start takes the fleet.yaml#discovery default pair. The new
  # root's daemon opens the window (gui block): bare looks for it every window_poll_s, up to window_wait_s, and
  # brings it to the front; when the wait runs out it opens (or raises) the window itself once and returns. With
  # gui.keep_open false it does not wait. Over ssh or without a desktop it attaches instead.
  # enabled: false = the history window of this fleet home (or one line and exit 1), as before this block.
  # start_args: further start flags, verbatim; the flags bare sets itself, --no-view / --gui / --attach and the
  # CLI / model flags are refused. Nothing here waives a safety check: a flag such as --allow-unsandboxed-pi goes
  # only into the operator's own block, as an explicit decision.
  # Override the whole block in the private file (~/.fleetmux/fleet.yaml); a missing key takes the value below.
  enabled: true
  name: main                        # default root fleet name (start --name)
  lifecycle: service                # start --lifecycle
  home: ~/.fleetmux/fleets/{name}   # its fleet home; {name} is the name above
  roster: null                      # start --roster PATH; null = none
  workers: null                     # start --workers N; null = start's default; not together with roster
  start_args: []
  window_wait_s: 30                 # s, longest wait for the daemon's window before bare opens it itself
  window_poll_s: 0.5                # s, between two looks for that window
  # host_terminal_env: environment variables that mark a host terminal, a terminal that is itself a pane of another
  # program. When one of them is set (non-empty), stdin and stdout are a terminal and the command does not run
  # inside a fleetmux pane, bare `fleetmux` attaches to the root fleet in that terminal (fleetmux attach --runtime)
  # instead of raising or opening the desktop window, also when the window is open; with no root it starts the bare
  # root fleet and then attaches without waiting for its window. Without a terminal (a pipe, a script) or inside a
  # fleetmux pane the window path is kept. start's automatic view does not read this list. HC_TERMINAL_ID marks a
  # Herdr terminal pane (HC_SCOPE is not used: commands Herdr runs without a terminal have it too).
  # [] turns this off; anything but a list of variable names is refused.
  host_terminal_env: [HC_TERMINAL_ID]

relay:
  # Multi-machine relay development (fleetmux/relay/). Several machines work on the tasks of one job through one
  # git hub; a machine that leaves or goes silent has its tasks taken over from the last checkpoint.
  # Every number the relay uses is here; the code has no defaults. A private `relay` block (~/.fleetmux/fleet.yaml)
  # is laid over this one key by key (and `hot` key by key), so it may name only the keys it changes.
  # Keys under `hot` are copied into the root fleet's Redis at start, read from there while running, and written
  # back every write_back_seconds.
  enabled: false                # the root fleet daemon starts the relay only when true
  state_remote: ""              # git remote for task, node, snapshot and salvage refs; "" = the code remote
  snapshot_timeout_s: 45        # s, limit of one checkpoint push (record + snapshot)
  takeover_md_max_lines: 60     # lines, maximum length of TAKEOVER.md
  text_max: 200                 # characters, clip length of titles and progress items in records
  secret_globs: [".env", ".env.*", "*.pem", "*.key", "id_rsa*", "id_ed25519*", "*.p12", ".netrc", "credentials*"]
  probe_timeout_s: 5            # s, limit of one local machine probe (performance-core count)
  notify_max: 1000              # characters a relay notice may carry
  reason_max: 200               # characters of a refusal reason in an audit line
  coordinator:                  # the optional coordinator role (a light task record without a sub-fleet)
    enabled: true               # false = no coordinator record is created
    prefer: ""                  # machine (node name) that should hold it; "" = always-on machines first
    takeover: true              # false = peers never take it over from a lost owner
  hot:
    beat_s: 60                  # s, node record push interval
    lost_after_s: 300           # s, no change of a node's refs this long (observer's own clock) = lost
    snapshot_s: 120             # s, automatic snapshot interval (pushed only when the tree changed)
    poll_s: 30                  # s, task table read interval
    git_timeout_s: 20           # s, limit of one git network operation
    max_tasks_per_node: 2       # tasks a machine works on at once
    max_heavy_per_node: 1       # heavy tasks a machine works on at once
    disk_floor_heavy_gb: 40     # GiB free disk below which a machine takes no heavy task
    disk_floor_any_gb: 15       # GiB free disk below which a machine takes no new task
    score: {cores: 1.0, mem_gb: 0.25, disk_free_gb: 0.02}   # weights of the capability score
    offline_grace_s: 0          # s, wait after a goodbye before others take its tasks (0 = at once)
    claim_stagger_s: 20         # s, the k-th ranked machine claims (k-1) x this later
    wake_gap_s: 180             # s, a gap between two loop turns above this = the machine just woke
    settle_s: 600               # s, a returning machine stays online this long before it takes new tasks
    budget_pause_gap_s: 60      # s, daemon tick gaps above this do not count against a time budget
    write_back_seconds: 300     # s, interval of writing changed hot keys back

restart_resume:
  # Restart state (docs/design.md section 60). The daemon writes a snapshot of its fleet (hot roster items, sub-fleets,
  # applets, jobs, in-flight Redis communication, errors) under <fleet home>/restart/<fleet>/ every snapshot_every_s
  # seconds, at the start of an operator stop, at a resume and before every new supervisor generation. After a
  # restart, and after every supervisor generation change, it compares the newest snapshot with the fleet now,
  # restores attached service sub-fleets as they were (jobs: section 58) and opens a reconcile ledger that the
  # supervisor rules item by item. Each key is validated on its own; a bad value keeps its default.
  enabled: true
  snapshot_every_s: 300      # s between two timer snapshots (the stop / resume / generation ones come on top)
  keep_timer: 12             # timer snapshots kept (an unconsumed baseline is always kept)
  keep_events: 20            # stop / resume / supervisor-generation snapshots kept
  ruling_remind_s: 3600      # s between two reminders of open ledger items to the supervisor
  item_payload_max: 20000    # bytes of one item's text kept in a snapshot (a request spec, a message)
  inline_items: 30           # items listed in the supervisor's notice; the rest are in the ledger's Markdown file
  keep_child_dirs: 20        # restart/job-* and split-* directories kept once their fleet ended and the ledger closed

# Decomposition tree (docs/design.md §62): the supervisor hands in a tree first and dispatches its blocks; the program
# keeps it in Redis fx:tree and <run>/tree.json. The private file's block replaces this one as a whole.
decompose:
  enabled: true                 # false = the old path (fx:items dispatch, dispatch leaf, contracts, 40-minute nudge)
  unit: minutes                 # estimates and actuals are minutes; costs are session minutes
  # Initial costs are medians (p50) of measured task-mode distributions; null = no data (counts 0).
  # margin follows cold_start: a saving under one cold start is noise.
  split: {k: 2, margin: 7.4, floor: 2}    # split only when dT >= k x dC and dT >= margin; blocks under floor merge
  # cold_start: session start to its first file edit, all task-mode slots (n=160; dev slots alone p50 9.8).
  # per_decision: a worker's blocked request to the next delivery to that slot (n=137).
  # merge: a delivery to an integration slot to its settle (n=106).
  # supervisor: a sub-fleet supervisor online the whole time counts 1 session minute per minute: the upper bound by
  # definition; the measured online ratio is not used (the sub-fleet span it divides by includes idle time after
  # the work ends, so it reads low).
  # spawn: approval to the sub-fleet being up.
  cost: {cold_start: 7.4, per_decision: 0.32, merge: 1.45, supervisor: 1.0, spawn: 0.3}   # session minutes
  overrun_ratio: 5              # a block on the longest chain past est x this: the supervisor is told
  returns_alert: 3              # returns of one block before the supervisor gets its cause line
  write_back_seconds: 300       # s, interval of writing changed values back to the private fleet.yaml
  session_minute_tokens: 9472   # display only: tokens per session minute (provisional)

# Interface language (docs/design.md §63): system (follow the system language) | en | zh-Hans.
# The private ~/.fleetmux/fleet.yaml may set its own `ui:` block; applies at the next start / server restart.
ui:
  language: system

# Release drift (docs/design.md section 56): the root daemon compares the release of every process of its run (root
# daemon, sub-fleet daemons, applets, fleetmux server) with the installed one (~/fleetmux-current) and switches the run
# to it when the drift outlived the grace, the installed release passes its self-check, no blackout window is open and
# no worker is in a turn. The switch continues the same run (<fleet home>/start.sh --resume with FLEETMUX_REL); a
# failed check goes back to the old release. Each key is validated on its own; a bad value keeps its default. The
# private fleet.yaml may set its own block (e.g. blackout windows), which replaces this one as a whole.
release_drift:
  enabled: true              # master switch of the automatic switch (false: no compare, no switch)
  check_interval_s: 600      # s between two compares
  grace_s: 900               # s the drift must last (since the daemon first saw it) before a switch
  idle_wait_s: 600           # s to wait for every worker to be idle; then the switch waits for the next compare
  blackout: []               # windows without a switch, "HH:MM-HH:MM" (an end before the start runs past midnight)
  timezone: ''               # IANA zone of the blackout windows ('' = this machine's zone)
  max_failures: 2            # failed switches to one installed release after which the daemon only reports
  stop_wait_s: 240           # s the switch waits for the daemons to exit after SIGTERM (applets end first)
  verify_s: 300              # s the switch waits for every process of the run to be up on the new release

# dev_task delivery (docs/design.md section 70). `via` is how a passing dev_task gate hands its work on:
#   rollout  rebase the feature branch onto the newest deploy branch, run test_cmd on that sha, and submit it to the
#            local rollout (the kind: git target of the same repository in the registry below, through the
#            registry's site.client); done when the rollout answers with a request id. The deploy branch is not moved.
#   queue    the older way: fast-forward the deploy branch and append a pending_approval row to deliver.queue.
# A job spec's own deliver.via wins over this default (the relay writes via: queue). The registry is the first of:
# $ROLLOUT_TARGETS, then the first existing file of `registries`. The private fleet.yaml may set its own block.
deliver:
  via: rollout
  registries: [~/.fleetmux/rollout-targets.yaml, ~/rollout-site/registry.yaml]
  submit_timeout_s: 600      # s the submit client may run before the delivery is reported blocked
