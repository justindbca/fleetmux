# fleetmux configuration: one file, one block per table.
#
# This file ships the defaults. The operator's private file has the same format:
#   $FLEETMUX_CONFIG, else ~/.fleetmux/fleet.yaml   (never part of this repository)
# A top-level block there replaces the shipped block as a whole (no deep merge). Only these blocks may
# be overridden there: accounts, tools, walls, lifecycle_modes, pi_context, daemon_watch, fresh_dispatch,
# discovery, remote, job_subfleet, gui, bare, relay, handoff, deliver, ... (fleet_config.USER_BLOCKS). cli_pairs (the real-smoke gate),
# watchdog_prompts (the dialog whitelist), models, profiles and capability_matrix change only here,
# through a reviewed commit.
#
# Blocks
#   cli_pairs          supervisor CLI x worker CLI x mode: which pairs passed a real smoke   (cli_pairs.py)
#   lifecycle_modes    what "done" means for a run and how it is closed                       (lifecycle.py)
#   walls              usage-wall wording, same-CLI downgrade, model aliases                  (brake.py)
#   watchdog_prompts   dialogs the watchdog may answer, markers it must hold                  (watchdog.py)
#   capability_matrix  domain x task type x model card -> enough / not enough                 (advisor.py)
#   models             model cards, keyed by card id                                          (agent_registry.py)
#   profiles           agent profiles (CLI + model card + role file), keyed by profile id     (agent_registry.py)
#   accounts           account pools for budget cards (empty here; fill in the private file)  (brake.py)
#   tools              tool pools reached through thin MCP servers (empty here)
#   pi_context         context window written into each run's pi models.json            (pi_adapter.py)
#   fresh_dispatch     when a reused worker earns the supervisor a "fresh" hint               (fleet_config.py)
#   handoff            context-handoff defaults: rotation and mid-turn thresholds, waits     (fleet_config.py)
#   dsh                dsh workers: the model when `start --dsh-model` is not given             (fleet_config.py)
#   gui                the root fleet daemon keeps its `fleetmux gui` window open               (gui_keep.py)
#   bare               the root fleet bare `fleetmux` starts when none runs                   (open_window.py)
#   relay              multi-machine relay development through one git hub                       (relay/params.py)
#   deliver            how a dev_task gate hands its work on: local rollout or queue file   (lifecycle_deliver.py)

cli_pairs:
  # Transport v2 supervisor_cli x worker_cli x mode table (read by fleetmux/cli_pairs.py).
  # Re-read on every check: an edit takes effect at the next start.
  #   status: verified   -> runs normally
  #           unverified -> runs only with --lifecycle smoke (cfg lifecycle == 'smoke')
  #           forbidden  -> refused; a pair/mode missing from this table is forbidden too
  #   adapter_missing: non-empty -> refused even for smoke
  #   reason: the refusal text shown to the user (unverified / forbidden / adapter_missing rows)
  #   verified_by: the real smoke (scripts/smoke_pair.sh, 1 supervisor + 2 workers, 4 v2 checks) that flipped it
  # Exception kept in code: claude+claude task or service with cfg adopt (docs/design.md §19 sub-fleet, §29 named).
  # CLI boundary (docs/design.md §6, §11 2026-10-13 "Codex/FlashNext via pi"): Claude agents run only the
  # official `claude` CLI; pi never uses Claude subscription credentials. Codex models (openai-codex/*, ChatGPT
  # login) and FlashNext run through pi. The official Codex TUI supervisor stays optional:
  # `start --supervisor-cli codex [--supervisor-profile X]` (codex+* rows below).
  # default keys: supervisor_cli, worker_cli, mode, supervisor_profile (Codex supervisor only),
  #   supervisor_pi_model / supervisor_pi_thinking (a defaulted pi supervisor only; used only when neither
  #   --supervisor-pi-model/-thinking nor an explicit --pi-model/--pi-thinking is given -- a typed flag always wins).
  #   Any other default key is a load error.
  # Night pair (no extra schema): pi+pi rows with per-agent models, e.g.
  #   start --supervisor-cli pi --worker-cli pi --supervisor-pi-model openai-codex/gpt-6-astra
  #     --supervisor-pi-thinking high --pi-model flashnext/<local-model> --lifecycle <mode>
  #   (or roster rows `pi_model:` per worker). An explicit --supervisor-cli pi does not read default.supervisor_pi_*;
  #   --supervisor-pi-model is required there, else --pi-model would put the supervisor on FlashNext too.
  version: 1
  # start fills unset --supervisor-cli/--worker-cli (and, for a pi supervisor, its pi model/thinking) from here.
  # User decision 2026-10-13: pi supervisor on openai-codex/gpt-6-astra (thinking high) + official Claude Code workers.
  default: {supervisor_cli: pi, worker_cli: claude, mode: task,
            supervisor_pi_model: openai-codex/gpt-6-astra, supervisor_pi_thinking: high}
  pairs:
    - {supervisor_cli: pi, worker_cli: pi, mode: task, status: verified, adapter_missing: [],
       verified_by: "design.md §11 §14", notes: "all-Pi bridge"}
    - {supervisor_cli: pi, worker_cli: pi, mode: service, status: verified, adapter_missing: [],
       verified_by: "design.md §11 §14", notes: "all-Pi bridge; night pair = pi Astra supervisor + pi FlashNext workers via per-agent models"}
    - {supervisor_cli: pi, worker_cli: claude, mode: task, status: verified, adapter_missing: [],
       verified_by: "real smoke scripts/smoke_pair.sh pi claude task: fleet-20261013-115145-828661b9 2026-10-13 @3421f0d8+feat/codex-via-pi worktree, 4/4 checks PASS",
       reason: "transport v2 pi supervisor + official Claude Code workers: verified by a real smoke (scripts/smoke_pair.sh pi claude task, see verified_by); shown only if this row is set back to unverified",
       notes: "default (user decision 2026-10-13): pi Astra/high supervisor + official Claude Code workers"}
    - {supervisor_cli: pi, worker_cli: claude, mode: service, status: verified, adapter_missing: [],
       verified_by: "real smoke scripts/smoke_pair.sh pi claude service: fleet-20261013-115347-7e61f9af 2026-10-13 @3421f0d8+feat/codex-via-pi worktree, 4/4 checks PASS",
       reason: "transport v2 pi supervisor + official Claude Code workers: verified by a real smoke (scripts/smoke_pair.sh pi claude service, see verified_by); shown only if this row is set back to unverified"}
    - {supervisor_cli: codex, worker_cli: claude, mode: task, status: verified, adapter_missing: [],
       verified_by: "user decision 2026-10-12; design.md §18", notes: "optional official Codex TUI supervisor + official Claude Code workers (default until 2026-10-13)"}
    - {supervisor_cli: codex, worker_cli: claude, mode: service, status: verified,
       adapter_missing: [], verified_by: "real smoke scripts/smoke_pair.sh codex claude service: fleet-20261012-155328-b5e88a63 2026-10-12 @8a31c3c7, 4/4 checks PASS",
       reason: "transport v2 Codex supervisor + Claude workers supports task mode only until service mode passes a real smoke (scripts/smoke_pair.sh codex claude service); result cards render off-model via tui_cards",
       notes: "auto_apply (Claude experts); cards -> <run>/cards/<slot>.log + history page Cards view"}
    - {supervisor_cli: codex, worker_cli: pi, mode: task, status: verified, adapter_missing: [], verified_by: "real smoke scripts/smoke_pair.sh codex pi task: fleet-20261012-153556-1888b011 2026-10-12 @8a31c3c7, 4/4 checks PASS",
       reason: "transport v2 mixed Pi/Codex fleets are unvalidated (supported: all-Pi, or Codex supervisor + Claude workers)",
       notes: "night pair (Codex supervisor + pi FlashNext workers); daemon wiring tested in tests/test_v2_codex_pi.py"}
    - {supervisor_cli: codex, worker_cli: pi, mode: service, status: verified, adapter_missing: [], verified_by: "real smoke scripts/smoke_pair.sh codex pi service: fleet-20261012-155132-be46943c 2026-10-12 @8a31c3c7, 4/4 checks PASS",
       reason: "transport v2 mixed Pi/Codex fleets are unvalidated (supported: all-Pi, or Codex supervisor + Claude workers)"}
    - {supervisor_cli: claude, worker_cli: pi, mode: task, status: verified,
       adapter_missing: [], verified_by: "real smoke scripts/smoke_pair.sh claude pi task: fleet-20261012-155507-b74b7b86 2026-10-12 @8a31c3c7, 4/4 checks PASS + scripts/smoke_claude_input.sh fleet-20261012-160527-a590623c",
       reason: "transport v2 Claude supervisor pairs are unverified (adapter: Stop-hook decision JSON, READY gate, UserPromptSubmit operator queue; live smoke pending)"}
    - {supervisor_cli: claude, worker_cli: pi, mode: service, status: verified,
       adapter_missing: [], verified_by: "real smoke scripts/smoke_pair.sh claude pi service: fleet-20261012-155802-2f8d1fac 2026-10-12 @8a31c3c7, 4/4 checks PASS",
       reason: "transport v2 Claude supervisor pairs are unverified (adapter: Stop-hook decision JSON, READY gate, UserPromptSubmit operator queue; live smoke pending)"}
    - {supervisor_cli: claude, worker_cli: claude, mode: task, status: verified,
       adapter_missing: [], verified_by: "real smoke scripts/smoke_pair.sh claude claude task: fleet-20261012-161127-cf26826f 2026-10-12 @8a31c3c7, 4/4 checks PASS",
       reason: "transport v2 Claude supervisor pairs are unverified (adapter: Stop-hook decision JSON, READY gate, UserPromptSubmit operator queue; live smoke pending)",
       notes: "adopted sub-fleet supervisor (cfg adopt, design.md §19) is allowed in code without smoke"}
    - {supervisor_cli: claude, worker_cli: claude, mode: service, status: verified,
       adapter_missing: [], verified_by: "real smoke scripts/smoke_pair.sh claude claude service (SUPERVISOR_MODEL=claude-opus-5-5, Studio, Claude Code 2.1.311): fleet-20261103-002352-7bf14526 2026-11-03 @22d269cc, 4/4 checks PASS",
       reason: "transport v2 Claude supervisor + Claude workers in service mode is unverified until scripts/smoke_pair.sh claude claude service passes 4/4",
       notes: "user decision 2026-11-03: Opus 5.5 replaces the walled Astra supervisor of the ops service fleet (Claude workers, service)"}
    - {supervisor_cli: codex, worker_cli: codex, mode: task, status: unverified, adapter_missing: [], verified_by: null,
       reason: "transport v2 Codex workers are unvalidated (supported: all-Pi, or Codex supervisor + Claude workers)"}
  # opencode workers (brief fleet-opencode-worker-20261016): the free OpenCode Zen model runs only inside the
  # opencode client (`opencode --standalone`, fleet plugin + agent_bridge.py); opencode is never a supervisor.
  # The model name comes from config (--opencode-model), never from code. Free tier: 200K window, concurrency
  # untested (default max_busy 2). Unverified until scripts/smoke_pair.sh <sup> opencode <mode> passes 4/4.
    - {supervisor_cli: pi, worker_cli: opencode, mode: task, status: unverified, adapter_missing: [], verified_by: null,
       reason: "transport v2 pi supervisor + opencode workers is unverified until a real smoke (scripts/smoke_pair.sh pi opencode task)"}
    - {supervisor_cli: pi, worker_cli: opencode, mode: service, status: verified, adapter_missing: [],
       verified_by: "real smoke scripts/smoke_pair.sh pi opencode service: fleet-20261017-092035-71528818 2026-10-17 @b49eb2e8 feat/opencode-worker worktree, 4/4 checks PASS; P1-01 TUI-session fix @704d2173 checked by real-TUI regression T4/T3 13/13 + repro GREEN (smoke not re-run)",
       reason: "transport v2 pi supervisor + opencode workers: verified by a real smoke (scripts/smoke_pair.sh pi opencode service, see verified_by); shown only if this row is set back to unverified"}
    - {supervisor_cli: codex, worker_cli: opencode, mode: task, status: verified, adapter_missing: [],
       verified_by: "real smoke scripts/smoke_pair.sh codex opencode task: fleet-20261017-091736-e572f3cb 2026-10-17 @b49eb2e8 feat/opencode-worker worktree, 4/4 checks PASS; P1-01 TUI-session fix @704d2173 checked by real-TUI regression T4/T3 13/13 + repro GREEN (smoke not re-run)",
       reason: "transport v2 Codex supervisor + opencode workers: verified by a real smoke (scripts/smoke_pair.sh codex opencode task, see verified_by); shown only if this row is set back to unverified"}
    - {supervisor_cli: codex, worker_cli: opencode, mode: service, status: unverified, adapter_missing: [], verified_by: null,
       reason: "transport v2 Codex supervisor + opencode workers is unverified until a real smoke (scripts/smoke_pair.sh codex opencode service)"}
  # dsh workers (design §41, plan dsh-fleet-worker-20261104): fleet's pane front-end drives `dsh --profile acp`
  # (DeepSeek Harness, exact 0.2.1-rc.5) on a pi models.json model (--dsh-model); worker-only, for comparison
  # with pi workers, not a default pair. FlashNext is shared: default max_busy 2.
    - {supervisor_cli: pi, worker_cli: dsh, mode: task, status: verified, adapter_missing: [],
       verified_by: "real smoke scripts/smoke_pair.sh pi dsh task: fleet-20261104-132341-aa15ae1d (BACKEND=cmux) + fleet-20261104-132632-237dacd8 (BACKEND=fleetmux) 2026-11-04 @84d226b2 feat/dsh-worker worktree (+ smoke script DSH_MODEL / BACKEND), 4/4 checks PASS each; pi Astra supervisor, 2 dsh workers on flashnext/Qwen3.8-Flash-Next-Uncensored-MLX-Serve-4bit",
       reason: "transport v2 pi supervisor + dsh workers: verified by a real smoke (scripts/smoke_pair.sh pi dsh task, see verified_by); shown only if this row is set back to unverified"}

lifecycle_modes:
  # Lifecycle modes (docs/design.md).
  # A lifecycle decides what "done" means and how a run is closed after done / blocked / timeout.
  # `start --lifecycle <mode>` is required; `base` maps it onto the transport mode (cfg['mode']:
  # task | service). The daemon re-reads this file when its mtime changes (no restart needed).
  version: 1
  require_mode_on_start: true          # start without --lifecycle -> refused
  common:
    on_blocked: {hold_hours: 12, then: stop_keep_resumable, notify: [tg, parent]}
    on_budget_exhausted: {hold_hours: 12, then: stop_keep_resumable, notify: [tg, parent]}
    close_workspace_after_stop: true
    notify_parent_session: true
  modes:
    service:
      base: service
      on_complete: never
      worker_idle_reclaim_min: 30
      idle_stop_hours: null            # null = never stops by itself
      stop: user_only
      clock_gate: false
    dev_task:
      base: task
      done_when: merged_to_deploy_branch_and_enqueued
      require_integrator_worker: true
      # master design v2 §4.14: the gate runs deliver.test_cmd, fast-forwards the deploy branch and enqueues.
      # There is no review step (no verdict file, no rounds); older review keys in a table are ignored.
      on_complete: stop_and_close
      notify: [tg, parent]
    program:
      base: task                       # each phase runs as a child dev_task fleet
      resident: false
      child_mode: dev_task
      ledger: program_ledger.json
      done_when: last_phase_merged
    scheduled:
      base: task
      hard_timeout_min: 150            # sector rotation: 150-minute budget, task dispatched within 90 min
      on_complete: stop_and_close
      on_fail: stop_and_close
      clock_gate: true                 # trading-day gate via global_clock; market closed -> not launched
      clock_market: US
    smoke:
      base: task
      bases: [task, service]           # pair acceptance (A cli_pairs): `--mode service` smokes a service pair
      on_any_end: stop_and_close

walls:
  # Wall table (one table for the whole fleet; brake.py reads it, the watchdog only "sees").
  # Absorbs the operator's cli_tier_map.yaml (same_cli_downgrade / aliases / default) and
  # the wall regexes of OpenClaw multi_agent_daemon.py (_RATE_LIMIT_PATTERNS, _MODEL_POOL_WALL_PATTERNS).
  # MAD keeps its own copy: change the CLI wall wording in both together (generic patterns: see below).
  #
  # account   : the whole account / CLI is walled (weekly / session / usage limit): every model of that account
  #             is skipped on the chain (an official CLI is one account; pi / opencode / dsh one per provider).
  # model_pool: only one model is walled ("You've reached your Fable limit"): only that model is skipped.
  # Either way the brake pauses and the slot (worker, or a main fleet's supervisor) moves to the next usable model
  # of its role's chain = the discovery block below (user 2026-11-11; docs/design.md §23); none left -> stop.
  # Only the CLIs' own wall wording (Claude / Codex) belongs here. Generic "rate limited" / "429 Too Many
  # Requests" / "quota exceeded" are NOT walls: third-party tools (Tavily, reddit, WebFetch) print them, and a
  # worker report pasted into the supervisor pane puts them on that screen (EF review r1 P1-01). MAD keeps
  # them because it only judges `-p` text; the two tables differ on purpose here.
  # Account patterns are checked first: a weekly-limit screen that also says /usage-credits is account-level.
  # Auth errors (401, Not logged in, expired OAuth) are not walls: the watchdog handles them.
  account:
    - "You've (?:hit|reached) your (?:usage|weekly|session|daily|monthly|5-hour) limit"
    - "\\b(?:weekly|session|daily|5-hour|usage) limit reached"
    - "Claude (?:AI )?usage limit reached"
    # Codex / pi (Astra, Sol, Terra) as seen 2026-11-09 on the strategy-engine Astra supervisor:
    # "Codex error: The usage limit has been reached".
    - "\\busage limit has been reached"
    # pi's own wording for a Codex 429 / usage_limit_reached without a server message (pi 1.5.0):
    # "You have hit your ChatGPT usage limit (plus plan). Try again in ~42 min."
    - "You (?:have|'ve) (?:hit|reached) your ChatGPT usage limit"
  model_pool:
    - "You've (?:hit|reached) your\\s+(?!(?:usage|weekly|session|daily|monthly|5-hour)\\b)[\\w.\\-]+.{0,20}?\\blimit\\b"
    - "Run /usage-credits to continue"   # the wall's own line; a bare /usage-credits is also on the reminder
    - "Set up usage credits"
  # Reminders, never walls (2026-11-09, design §48.4): Claude Code 2.1.316 prints "You've used 78% of your weekly
  # limit · resets 3am (…) · /usage-credits to keep using…" while there is quota left. A line matching one of
  # these is skipped before the account / model_pool rules (both scopes); only spent wording is a wall.
  notices:
    - "You've used \\d+(?:\\.\\d+)?% of your\\b"
    - "/usage-credits to keep using"
  # Safeguards refusal (user 2026-11-23, docs/design.md section 23): the Claude CLI's own refusal of one message,
  # "API Error: <model>'s safeguards flagged this message (https://www.anthropic.com/legal/aup). ...", ending the
  # turn with StopFailure (error invalid_request). Scope model_pool (only that model is skipped), kind safeguards.
  # Read only from CLI-owned text: the StopFailure hook's error fields and the transcript's API-error row, and on a
  # screen only a line that also matches safeguards_screen (the CLI's own error line: the result glyph U+23BF, then
  # "API Error:"). A turn text or a report pasted into a pane is never read for it.
  # The slot then walks its role's WHOLE discovery chain: first the entries whose model matches a safeguards_prefer
  # pattern (discover.matches, the only_via pattern form; gpt = the OpenAI family on pi), in chain order, then the
  # other entries in chain order, skipping the flagged model; none usable -> stop.
  # StopFailure: the transcript's API-error row of this turn and error_details are read; last_assistant_message only
  # when no such row could be read yet and the hook's error type is one of safeguards_error_types.
  # A private walls block that lacks one of these four keys gets the shipped value; a key set to [] turns it off.
  safeguards:
    - "safeguards flagged this message"
  safeguards_screen:
    - "^\\s*\u23bf\\s+API Error:.{0,80}?safeguards flagged this message"
  safeguards_prefer: [gpt]
  safeguards_error_types: [invalid_request]
  # How a fleet delivery is drawn on a pane (docs/design.md section 67, "Delivered text on a screen"). A wall line
  # quoted inside a delivered block is not the CLI's own line and never trips the brake; the CLI's own wall row
  # after the block always does (the position rule of section 67 is unchanged). Per shape: `head` opens a block,
  # every following non-empty row at `body_indent` or right of it is delivered text, and the block ends at the
  # first row left of it or matching `cli_row` (a row the CLI draws itself). A row whose wall match starts near its
  # beginning counts as the CLI's own. Shipped: the demo / scripted actor only. Claude Code is not measured: a
  # live capture shows the tail of a delivered text drawn at column 2, but not the head row or the block end, so
  # it has no row yet; Codex, opencode and pi are not measured either (no row: every wall line on their screens
  # counts, as before, including one quoted in a delivery). A private walls block without this key gets the
  # shipped value; [] turns it off.
  delivery_screen:
    - name: demo
      head: "^\u25c0 "
      body_indent: 2
      cli_row: "^\\s*[\u23bf\u23fa\u25b6\u25c0\u273b\u25a0\u2022\u276f\u2500\u2594]"
  # Same CLI one tier down (2026-09-20). Codex gpt-5.6-* names are copied as-is: v1 design §91
  # flags them as stale; fix them here when the Codex catalogue is confirmed. Not read by the wall decision since
  # 2026-11-11 (the discovery chain replaced it); kept as the copy of the operator's cli_tier_map.yaml.
  same_cli_downgrade:
    claude-fable-5: claude-sonnet-5
    claude-opus-5: claude-sonnet-5
    gpt-5.6-sol: gpt-5.6-luna
    gpt-5.6-terra: gpt-5.6-luna
  aliases:
    fable: claude-fable-5
    opus: claude-opus-5
    sonnet: claude-sonnet-5
    haiku: claude-haiku-5-5          # 2026-10-14: Claude Code 2.1.296 resolves the haiku alias to 5.5 (cli_tier_map d45fe764)
    claude-haiku-4-5-20251001: claude-haiku-4-5
    claude-opus-4-8: claude-opus-5
    gpt-5.5: gpt-5.6-terra
    gpt-reserve: gpt-5.6-luna
  # Model assumed when a slot names none.
  default:
    codex: gpt-5.6-terra
    claude: claude-fable-5

watchdog_prompts:
  # Watchdog prompt table (docs/design.md §24). Hot-reloaded: the daemon re-reads this file when it
  # changes; an invalid edit is refused (audited) and the previous table stays in force.
  #
  # prompts: whitelist of KNOWN, harmless confirmation dialogs. When every string in `match` (case-
  #   insensitive, literal) is on the last `tail_lines` lines of the agent's screen, the watchdog
  #   saves the screen and sends `keys` (cmux send-key names). The same dialog answered `max_hits`
  #   times within one delivery stops being answered: the slot is treated as stalled.
  #   `any` (optional) additionally needs at least one of its strings.
  #   `verify` (required): matching text is NOT an authorisation. Before any key is sent the watchdog
  #   checks that the pane is this run's own (cmux registry, not an adopted pane) and that the
  #   dialog's concrete operation / path lies inside a grant the run already has:
  #     own_cwd       every path shown is the slot's own directory (trusted at spawn)
  #     paths_in_run  every path shown is inside the slot directory or <run>/workspace (--add-dir)
  #   If the scope cannot be read off the screen, nothing is pressed: screen saved, the slot is marked
  #   prompt_wait and dispatch pauses (not a hold: once a human answers in the pane the turn settles).
  # unknown_markers: a screen that shows one of these but matches no whitelist entry is an UNKNOWN
  #   dialog: the screen is saved, the slot is marked prompt_wait, and nothing is pressed (an Enter
  #   could approve something the task never authorised).
  #   For claude / pi slots a marker (or a whitelist match) counts only when the screen does not end in the
  #   CLI's own input box (2026-11-09, watchdog.input_box): text the agent writes above its prompt is not a dialog.
  #   Deletions are always the user's call (2026-10-14): "dangerous rm" is an unknown marker, never a
  #   whitelist entry, and nothing in the fleet answers a delete confirmation (no PermissionRequest hook).
  # delete_markers (optional): extra words / phrases that make a dialog a delete (moves / renames count).
  #   The built-in list (fleetmux/watchdog.py DELETE_MARKERS: rm, unlink, delete, remove, mv, rename,
  #   git clean, DROP TABLE, 删除, 移动 ...) is always in force; this list can only add to it. Any of them
  #   in the last tail_lines rows means no key is ever pressed by the program, even on a whitelisted dialog.
  tail_lines: 25
  max_hits: 3
  prompts:
    - name: read_outside
      # "Read outside the working directories?" (E2: hub stuck 26 days on it).
      match: ["outside the working director"]
      keys: [Enter]
      verify: paths_in_run
    - name: trust_folder
      # Claude Code 2.1.280, captured live 2026-10-12 in a throwaway PTY: "Accessing workspace: <path>
      # ... Is this a project you created or one you trust?" with "❯ No, exit" PRESELECTED; Enter alone
      # would close the session. Down was verified live to move the cursor to "Yes, I trust this folder".
      match: ["yes, i trust this folder", "❯ no, exit"]
      keys: [Down, Enter]
      verify: own_cwd
    - name: trust_folder_legacy
      # Codex "Trust this folder?" / older Claude "Do you trust the files in this folder?" (default Yes).
      # Text NOT reproduced live: Codex 0.162.1 showed no trust dialog in a non-git directory.
      match: ["trust"]
      any: ["trust this folder?", "trust the files in this folder"]
      keys: [Enter]
      verify: own_cwd
  unknown_markers:
    # Claude Code asks for `rm` on a possibly-empty variable even under --dangerously-skip-permissions
    # (10/12 E16). Every delete is confirmed by the user: screen saved, slot marked, no key pressed.
    - "Dangerous rm"
    - "Do you want to proceed?"
    - "Do you want to make this edit"
    - "Do you want to create"
    - "❯ 1. Yes"
  delete_markers: []

capability_matrix:
  # 模型能力实验表（顾问的唯一软依据；advisor 设计稿 §7）。数据不是代码，每次会诊现读（热载）。
  # 结构：<领域（= context_domains.yaml 的键）>: <任务类型>: <模型卡 id>: {verdict, effort?, note?}
  # verdict ∈ enough / enough_simple / not_enough / overkill / untested / reserve
  # untested 的格禁选，除非这一行所有已测格都是 not_enough（daemon 记 capability.gap）。
  research_web:
    web-research:
      sonnet: {verdict: enough, effort: medium}
      opus: {verdict: overkill}
      haiku: {verdict: untested}
    long-form-summary:
      sonnet: {verdict: enough_simple}
  fleet:
    code-edit:
      sonnet: {verdict: enough_simple, note: "单文件、路径已明"}
      opus: {verdict: enough}
      fable: {verdict: reserve, note: "合并时读代码 / 会诊"}
    review:
      opus: {verdict: enough}
      sonnet: {verdict: not_enough}

