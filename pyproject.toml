[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetmux"
version = "0.2.2"
description = "Run AI teams: a supervisor agent leads worker agents (Claude Code, Codex, Pi, opencode), and the program, not the model, accepts the work."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["redis>=4.0", "PyYAML>=5.1"]
classifiers = [
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fleetmux-py = "fleetmux.fleet:main"

[tool.setuptools.packages.find]
include = ["fleetmux*"]

[tool.setuptools.package-data]
"fleetmux.backends" = ["keys.json"]
fleetmux = ["agents/*.md", "agents/devflow/*.md", "agents/devflow/*.yaml", "pi_extension*.ts", "config/*.yaml",
            "dsh_bridge.mjs", "opencode_plugin/*.js", "opencode_plugin/package.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
